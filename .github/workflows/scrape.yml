name: Scrape MTProto Proxies
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  scrape-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium==4.18.1 webdriver-manager==4.0.1
    - name: Run Proxy Scraper
      run: python scrape_bot.py
    - name: Commit and Push generated proxies
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add mtpro_proxies.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update mtpro proxies" && git push)
